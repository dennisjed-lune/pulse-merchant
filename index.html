<script>window.RFP_REQS={"CL-11.1": {"p": "PCLO", "s": "11. Campaign Management", "sub": "Campaign Setup & Targeting", "r": "Provide a central campaign management console for creation, configuration, review, approval, scheduling, launch, monitoring, pause, termination and archival of PCLO campaigns.", "pr": "Must-have", "c": "Partially Compliant", "a": "Merchants create campaign requests, Lune operations reviews and configures them, and banks approve them. Pulse schedules the launch and closes the campaign at its end date or when the budget is used. Pause and archive are on the roadmap."}, "CL-11.10": {"p": "PCLO", "s": "11. Campaign Management", "sub": "Testing, Change & Monitoring", "r": "Provide pre-launch validation that identifies missing mandatory fields, invalid merchant/MID mappings, conflicting rules, overlapping dates, audience issues and budget configuration errors.", "pr": "Must-have", "c": "Fully Compliant", "a": "Pulse checks each campaign before submission: mandatory fields, dates, budget, cap, minimum spend, at least one MID, and the shape of the audience rule. The bank must select card programmes before it can approve."}, "CL-11.15": {"p": "PCLO", "s": "11. Campaign Management", "sub": "Testing, Change & Monitoring", "r": "Maintain a full audit trail of campaign creation, approvals, edits, pauses, cancellations and user actions, including before/after values.", "pr": "Must-have", "c": "Fully Compliant", "a": "Pulse records who submitted, changed, dispatched and approved each campaign, and when. Lune keeps a version history of campaigns sent to banks and a change history of campaign records.", "triage": "now"}, "CL-11.18": {"p": "PCLO", "s": "11. Campaign Management", "sub": "Testing, Change & Monitoring", "r": "Provide campaign health monitoring including budget consumption, transaction/reward activity, exceptions, merchant/MID mapping issues and communication status.", "pr": "Must-have", "c": "Partially Compliant", "a": "Lune operations monitors budget use, activations, cashback and exceptions for each campaign. A campaign health view for banks and merchants is on the roadmap."}, "CL-11.19": {"p": "PCLO", "s": "11. Campaign Management", "sub": "Multi-Market Administration", "r": "Support multi-issuer, multi-market and multi-program campaign administration with logical segregation of data, users, configurations and approval rights.", "pr": "Must-have", "c": "Fully Compliant", "a": "Pulse keeps each bank's data, users, settings and approvals separate. Each market runs in its own regional deployment."}, "CL-11.2": {"p": "PCLO", "s": "11. Campaign Management", "sub": "Campaign Setup & Targeting", "r": "Support an end-to-end campaign workflow with configurable statuses such as Draft → Review → Approved → Scheduled → Live → Paused/Ended → Archived.", "pr": "Must-have", "c": "Partially Compliant", "a": "Each campaign moves through Draft, Pending review, Under review, In bank review, Scheduled, Live, and Completed or Rejected. Paused and Archived statuses and configurable statuses are on the roadmap."}, "CL-11.21": {"p": "PCLO", "s": "11. Campaign Management", "sub": "Offer Intake & Readiness", "r": "Provide a structured offer-request and intake workflow before configuration begins, with mandatory field validation, dependency tracking, accountable owner, target launch date, approval routing, rejection/rework status and complete audit history.", "pr": "Must-have", "c": "Fully Compliant", "a": "Merchants submit campaign requests through the merchant portal or the API. Pulse checks the mandatory fields. Lune operations reviews each request, can reject it with a reason, and records who changed it and when."}, "CL-11.24": {"p": "PCLO", "s": "11. Campaign Management", "sub": "Live Change & Emergency Control", "r": "Provide emergency pause and partial-suspension controls by programme, market, merchant, MID, outlet, audience or channel, with authorised approval, immediate stakeholder notification, reason codes, recovery validation and controlled resume.", "pr": "Must-have", "c": "Partially Compliant", "a": "Lune operations can suspend all activity for a bank at once. Pause by market, merchant, MID, outlet, audience or channel, with reason codes and controlled resume, is on the roadmap."}, "CL-11.3": {"p": "PCLO", "s": "11. Campaign Management", "sub": "Campaign Setup & Targeting", "r": "Support role-based maker-checker / four-eyes approval for campaign creation and material campaign changes before publication.", "pr": "Must-have", "c": "Fully Compliant", "a": "Each campaign needs three approvals before it goes live. The merchant submits it, Lune operations reviews it, and the bank approves or rejects it with reasons. Terms cannot change after the bank approves."}, "CL-11.4": {"p": "PCLO", "s": "11. Campaign Management", "sub": "Campaign Setup & Targeting", "r": "Automatically stop qualification/redemption when a campaign expires, is paused, reaches its budget/cap or is otherwise made ineligible according to configured rules.", "pr": "Must-have", "c": "Fully Compliant", "a": "Pulse stops qualification automatically at the campaign end date and when the budget is used. The offer then leaves customer channels."}, "CL-11.5": {"p": "PCLO", "s": "11. Campaign Management", "sub": "Campaign Setup & Targeting", "r": "Support reusable campaign and offer templates, standard offer libraries, cloning and portfolio rollover, including rules, content, merchant mappings, audience settings and approved assets, to accelerate repeat and multi-market setup.", "pr": "Must-have", "c": "Partially Compliant", "a": "Pulse composes standard terms, conditions and how-to-earn text for each offer. Campaign templates, cloning and rollover are on the roadmap."}, "CL-11.6": {"p": "PCLO", "s": "11. Campaign Management", "sub": "Campaign Setup & Targeting", "r": "Support bulk campaign setup and maintenance through UI upload, file and/or API for offers, merchants, MIDs, locations and audience assignments.", "pr": "Must-have", "c": "Partially Compliant", "a": "Merchants add brands, MIDs and terminals through the merchant portal or the API. Bulk upload by file is on the roadmap."}, "CL-11.8": {"p": "PCLO", "s": "11. Campaign Management", "sub": "Campaign Setup & Targeting", "r": "Support campaign targeting using customer, card/BIN, merchant, MID/outlet, geography, channel, transaction, behavioural and time-based criteria available to the program.", "pr": "Must-have", "c": "Fully Compliant", "a": "Campaigns target by customer behaviour and segment, card BIN, merchant, MID and terminal, channel and dates (CL-3.19)."}, "CL-11.9": {"p": "PCLO", "s": "11. Campaign Management", "sub": "Campaign Setup & Targeting", "r": "Support audience sizing / eligibility estimation before launch where the required customer and transaction data is available.", "pr": "Nice-to-have", "c": "Fully Compliant", "a": "Lune operations tests the audience rule before launch and sees the number of eligible customers and sample records. The bank sees the audience size when it reviews the campaign."}, "CL-13.1": {"p": "PCLO", "s": "13. Merchant & MID Management", "sub": "Merchant Onboarding & Mapping", "r": "Support onboarding and maintenance of merchants, brands, outlets, MIDs and terminal identifiers individually and in bulk through UI, file and/or API.", "pr": "Must-have", "c": "Partially Compliant", "a": "Merchants and Lune operations add brands, MIDs and terminals through the portals and the API. Bulk onboarding by file is on the roadmap."}, "CL-13.6": {"p": "PCLO", "s": "13. Merchant & MID Management", "sub": "Merchant Onboarding & Mapping", "r": "Support merchant hierarchies linking brand → merchant/legal entity → outlet/location → MID → terminal where available.", "pr": "Must-have", "c": "Fully Compliant", "a": "Pulse links each merchant to its brands, each brand to its MIDs with the acquirer, and each MID to its terminals with name and channel."}, "CL-2.2": {"p": "PCLO", "s": "2. Transaction Matching", "sub": "Ingestion & Matching Rules", "r": "Match transactions to offers using configurable transaction attributes including merchant identifier, MCC, MID, geography/location, amount, date, terminal ID, card-present (CP), card-not-present (CNP), and tokenised wallet transactions such as Apple Pay, Google Pay and Samsung Pay.", "pr": "Must-have", "c": "Fully Compliant", "a": "Pulse matches purchases to offers using configured merchant and terminal identifiers, transaction amount and date, and card BIN. Pulse supports Apple Pay, Google Pay and Samsung Pay transactions when the issuer provides the underlying card’s BIN and the other transaction fields required by the offer. The same cardholder eligibility and offer activation checks apply to wallet and physical-card purchases."}, "CL-2.22": {"p": "PCLO", "s": "2. Transaction Matching", "sub": "Merchant & Channel Matching", "r": "Support merchant hierarchy and merchant grouping so multiple MIDs, terminal IDs, outlets, descriptors and acquiring relationships can map to one eligible merchant/brand.", "pr": "Must-have", "c": "Fully Compliant", "a": "Pulse groups multiple MIDs, terminal IDs and outlet mappings under one merchant brand. Each MID records its acquirer. Lune enrichment maps description variants to a consistent brand name. Campaigns select eligible outlets through MIDs and terminal IDs. An enriched brand name does not establish cashback eligibility. Pulse requires a match to configured merchant identifiers and the other offer conditions."}, "CL-3.1": {"p": "PCLO", "s": "3. PCLO Offer Rules", "sub": "Offer Types & Funding", "r": "Support all four offer content types: card-linked, affiliate, domestic and cross-border.", "pr": "Must-have", "c": "Fully Compliant", "a": "Pulse supports card-linked and affiliate offers for domestic and cross-border purchases. Pulse uses affiliate purchase records to attribute rewards on eligible affiliate purchases."}, "CL-3.15": {"p": "PCLO", "s": "3. PCLO Offer Rules", "sub": "Limits, Timing & Priority", "r": "Support time-based offer rules including time of day, day of week, defined date ranges and blackout periods.", "pr": "Must-have", "c": "Partially Compliant", "a": "Pulse supports a date range for each campaign."}, "CL-3.16": {"p": "PCLO", "s": "3. PCLO Offer Rules", "sub": "Limits, Timing & Priority", "r": "Support per-cardholder, per-card, per-transaction, daily, monthly and campaign-lifetime redemption/spend caps.", "pr": "Must-have", "c": "Partially Compliant", "a": "Pulse supports a cap per customer for each campaign and a campaign budget."}, "CL-3.2": {"p": "PCLO", "s": "3. PCLO Offer Rules", "sub": "Offer Types & Funding", "r": "Support both merchant-funded and bank-funded rebates on the same platform.", "pr": "Must-have", "c": "Fully Compliant", "a": "Pulse supports merchant-funded and bank-funded rebates on the same platform. Each offer identifies the funding party for settlement and reconciliation."}, "CL-3.3": {"p": "PCLO", "s": "3. PCLO Offer Rules", "sub": "Offer Rules & Eligibility", "r": "Support offer constructs applied to card-linked matching including single visit, cumulative spend, multi-visit, multi-redemption with minimum spend, and dynamic/tiered offers.", "pr": "Must-have", "c": "Fully Compliant", "a": "Pulse awards cashback on each qualifying purchase. Each offer can set a minimum spend and a cashback cap per cardholder. A cardholder can earn cashback on more than one purchase, subject to the cap."}, "CL-3.4": {"p": "PCLO", "s": "3. PCLO Offer Rules", "sub": "Offer Rules & Eligibility", "r": "Support configurable rebate calculations including fixed amount, percentage, tiered by transaction amount, and capped rewards.", "pr": "Must-have", "c": "Fully Compliant", "a": "Pulse calculates cashback as a fixed amount, a percentage or a tier based on the transaction amount. Offers can cap the cashback per cardholder."}, "CL-3.7": {"p": "PCLO", "s": "3. PCLO Offer Rules", "sub": "Offer Rules & Eligibility", "r": "Support cashback and points/equivalent reward constructs, including fixed, percentage, tiered and capped mechanics, where required by the issuer proposition.", "pr": "Must-have", "c": "Fully Compliant", "a": "Pulse supports cashback and points rewards. Each offer can use a fixed amount, a percentage or a tiered reward. The offer can also set a reward cap."}, "LAF-101": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Earn Rules & Decisioning", "sub": "Monthly product cap", "r": "Configure maximum points per customer, product or programme for a defined monthly period.", "pr": "Must-have", "c": "Fully Compliant", "a": "Each campaign has a cashback or points cap for each customer, monthly and over the whole campaign, and a total budget."}, "LAF-86": {"p": "Loyalty Accrual Engine", "s": "Functional Requirements | Earn Rules & Decisioning", "sub": "Rule group caps", "r": "Configure monthly and lifetime point limits at rule-group level.", "pr": "Must-have", "c": "Fully Compliant", "a": "Each campaign has cashback or points limits for each customer, monthly and over the whole campaign."}, "OM-1.1": {"p": "OMS", "s": "OM-1 — Offer Management", "sub": "Offer Types & Setup", "r": "Support percentage-discount, fixed-value discount, free-format benefit, promotional-code, product/SKU-based, bundle and value-added benefit offers.", "pr": "Must-have", "c": "Fully Compliant", "a": "Percentage, fixed-value cashback and promo-code offers are fully supported, each with a benefit cap, minimum spend, budget, validity window and store assignment. Free-format and value-added benefits are presented through offer content. SKU and bundle offers are not supported."}, "OM-1.5": {"p": "OMS", "s": "OM-1 — Offer Management", "sub": "Rules & Lifecycle", "r": "Support always-on, limited-time, seasonal, event-based, flash-sale and invitation-only offers, including scheduled seasonal catalogue placement.", "pr": "Must-have", "c": "Fully Compliant", "a": "Offers run either for fixed dates or until their budget is exhausted. Offers go live and expire automatically on their scheduled dates, which covers limited-time, seasonal, event-based and flash-sale campaigns. Invitation-only offers are targeted to a selected customer audience."}, "OM-1.6": {"p": "OMS", "s": "OM-1 — Offer Management", "sub": "Rules & Lifecycle", "r": "Provide a controlled workflow to draft, configure, review, approve, schedule, publish, pause, expire, withdraw and archive offers.", "pr": "Must-have", "c": "Fully Compliant", "a": "Offers go through the following status- draft, internal review (and configure), bank review and approval or rejection, then scheduled go-live and automatic expiry.  Each step is a status change made by an authorised user.  Admins can also change an offer’s status directly, including pausing, resuming or withdrawing it."}, "OM-1.7": {"p": "OMS", "s": "OM-1 — Offer Management", "sub": "Rules & Lifecycle", "r": "Support configurable maker-checker and multi-level approval workflows by tenant, market, issuer, merchant and offer type.", "pr": "Must-have", "c": "Partially Compliant", "a": "Every offer goes through two levels of approval- Lune’s internal review, then the issuing bank’s review. Role-based access (reader, writer, super-admin) controls who can make and approve changes."}, "OM-2.1": {"p": "OMS", "s": "OM-2 — Offer Publishing & Distribution", "sub": "Channels, Sharing & Publishing", "r": "Publish approved offers from a common offer pool to multiple issuer websites, mobile apps and authorised portals, with independently configurable offer sets and categories per portal.", "pr": "Must-have", "c": "Fully Compliant", "a": "Approved offers are sent from the central offer pool to each issuer tenant and delivered to their websites, mobile apps and portals through the offer feed API/SDK. Each tenant or portal has its own configurable set of offers and categories."}, "OM-3.1": {"p": "OMS", "s": "OM-3 — Merchant & Store Management", "sub": "Merchant Onboarding", "r": "Support both merchant self-registration and operator-assisted onboarding, capturing legal name, trading name, description, country, currency, address, contacts, account users, logo and required documentation.", "pr": "Must-have", "c": "Fully Compliant", "a": "Lune operators can onboard merchants from the admin portal, capturing merchant legal and trading names, logo, region and account users. Merchants can also self-register and create their brand through the merchant portal."}, "OM-3.5": {"p": "OMS", "s": "OM-3 — Merchant & Store Management", "sub": "Merchant Onboarding", "r": "Maintain a unique merchant identity and detect potential duplicate merchant, brand, store and contact records.", "pr": "Must-have", "c": "Fully Compliant", "a": "Each brand maps to one global brand ID and can belong to only one merchant. Each merchant ID is unique across the platform, terminal IDs are unique within a merchant and merchant user emails are also unique."}, "OM-3.6": {"p": "OMS", "s": "OM-3 — Merchant & Store Management", "sub": "Merchant Portal & Stores", "r": "Maintain merchant group, brand, legal entity, online channel, branch and store hierarchies, including store name, address, contact details, opening hours, website/social links and geography.", "pr": "Must-have", "c": "Fully Compliant", "a": "Merchants are modelled as a hierarchy- merchant (legal entity) > brands > merchant IDs > terminals/stores, with each store tagged as in-store or online. Brands hold website and social links a category and a sub-category. Stores hold a name, address, contact details, opening hours and location."}, "OM-3.9": {"p": "OMS", "s": "OM-3 — Merchant & Store Management", "sub": "Merchant Portal & Stores", "r": "Allow merchants to create or propose offers subject to configurable Mastercard/operator approval workflows.", "pr": "Must-have", "c": "Fully Compliant", "a": "Merchants propose offers by submitting campaign requests from the merchant portal. Each request goes through internal review and then "sub": "Integration, Security & Scale", "r": "Support SSO and federation using industry-standard protocols for Mastercard, issuer and merchant users.", "pr": "Must-have", "c": "Fully Compliant", "a": "Mastercard, issuer and merchant users can sign in with single sign-on (SSO) using SAML 2.0 or OpenID Connect, federated with each organisation’s own identity provider."}};</script><script>/* Merchant portal + RFP Build 01 (wizard). Add-on for the merchant demo (lune-demo-48b.pages.dev/merchant.html).

(() => {
'use strict';
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    <div class="grid grid-cols-3 gap-4">${unit('capDay', 'Cap per day', r.capDay, 'AED', '', 'CL-3.16')}${unit('capMonth', 'Cap per month', r.capMonth, 'AED', '', 'CL-3.16 LAF-86 LAF-101')}${unit('capCard', 'Cap per card', r.capCard, 'AED', '', 'CL-3.16')}</div></div>`;
};
/* Step 3, review: one more section that lists the rules beyond today's fields */
const reviewSection = (w) => {
  const r = rx(w);
  const T = { percent: 'Percentage cashback', fixed: 'Fixed-value cashback', tiered: 'Tiered cashback' };

    ['Time', r.timeFrom && r.timeTo ? `${r.timeFrom} to ${r.timeTo}` : 'All day', r.timeFrom && r.timeTo ? plan('CL-3.15') : ''],
    ['More caps', [r.capDay && `AED ${r.capDay} per day`, r.capMonth && `AED ${r.capMonth} per month`, r.capCard && `AED ${r.capCard} per card`].filter(Boolean).join(', ') || 'None', r.capDay || r.capMonth || r.capCard ? plan('CL-3.16') : '']];

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (sel, root = document) => root.querySelector(sel);
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONTHS_LONG = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const parseD = (s) => { if (!s) return null; const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const isoD = (dt) => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
const fmtMDY = (s) => { const d = parseD(s); return d ? `${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}` : '-'; };
const fmtDMY = (s) => { const d = parseD(s); return d ? `${String(d.getDate()).padStart(2, '0')} ${MONTHS[d.getMonth()]} ${d.getFullYear()}` : '-'; };
const fmtMD = (s) => { const d = parseD(s); return d ? `${MONTHS[d.getMonth()]} ${d.getDate()}` : '-'; };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return isoD(d); };
const diffDays = (a, b) => Math.round((parseD(b) - parseD(a)) / 86400000);
const todayISO = () => isoD(new Date());
const num = (v) => { if (v === '' || v == null) return null; const n = Number(String(v).replace(/,/g, '')); return Number.isFinite(n) ? n : null; };
const money = (n) => (n == null ? '-' : `AED ${Number(n).toLocaleString('en-US')}`);
const initials = (email) => (email || '').replace(/[^a-z]/gi, '').slice(0, 2).toUpperCase();
const relTime = (iso) => {
  const mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (mins < 1) return 'Just now';
  if (mins < 60) return `${mins} min ago`;
  const h = Math.round(mins / 60); if (h < 24) return `${h} hour${h > 1 ? 's' : ''} ago`;
  const d = Math.round(h / 24); if (d < 30) return `${d} day${d > 1 ? 's' : ''} ago`;
  return fmtMDY(iso.slice(0, 10));
};

const sortRows = (rows, sort, getters) => {
  if (!sort) return rows;

  return [...rows].sort((a, b) => { const x = g(a), y = g(b); const r = x == null ? 1 : y == null ? -1 : x > y ? 1 : x < y ? -1 : 0; return sort.order === 'asc' ? r : -r; });
};

/* ------------------------------------------------------------------ ANALYTICS (Figma "Complete merchant Journey" › 08 · Analytics)
   Every figure is the sum of per-campaign figures, so totals add up for any campaign selection and period.
   Data runs to the last nightly update (MA_ASOF). All figures are illustrative. */
const MA_ASOF = DEMO ? addDays(todayISO(), -1) : '2026-10-27';   // last nightly update
const MA_COLORS = ['#3d70d9', '#8b5cd6', '#e8833a', '#d64f8b', '#2aa3a3', '#b8932a', '#6b7a8f', '#c2410c'];
const MA_TOTAL = '#0a634d';
const MA_TIPS = {
  perf: 'Weekly totals, Monday to Sunday. Hover the chart to see every line for that week.',
  gmv: 'Sales value of purchases that earned cashback. Excludes rejected attempts.',
  roc: 'Net GMV for each AED 1 of net cashback. It includes purchases customers would have made anyway.',
  cost: 'Cashback accrued in this period, minus cashback reversed after returns.',
  atv: 'Average spend per purchase that earned cashback (GMV ÷ redemptions).',
  budget: 'Budget used counts cashback accrued, before refunds.',
  position: 'This campaign’s share of what you owe, as of last night.',
  released: 'Cashback released after the hold period, as of the latest nightly update.',
  hold: 'Cashback not payable yet, because the customer can still return the goods.',
  channel: 'Online checkout vs in-store. Checked when the data arrives.',
  audience: 'Customers who hold a card selected for this campaign',
  dnq: 'Purchases that didn’t earn because of minimum spend, cap or budget.',
};
const MA_PERIODS = [['30d', 'Last 30 days', 30], ['90d', 'Last 90 days', 90], ['6m', 'Last 6 months', 182], ['12m', 'Last 12 months', 365], ['custom', 'Custom range']];
const MA_DNQ = ['Minimum spend not met', 'Per customer cashback cap reached', 'Campaign budget used up', 'Offer already used'];
const MA_BUCKETS = ['Below / AED 100', 'AED / 100–249', 'AED / 250–499', 'AED / 500–999', 'AED / 1000+'];

/* hand-set figures for Faces, taken from the Figma "Multiple campaigns" frames */
const MA_SPEC = DEMO ? {} : {
  221: { gmv: 331200, red: 1380, cust: 953, acc: 33115, rev: 1140, hold: 12980, dnq: [38, 20, 0, 2], funnel: [18400, 8100, 2400], repeat: 0.27 },
  222: { gmv: 240260, red: 1190, cust: 960, acc: 24604, rev: 590, hold: 0, dnq: [30, 16, 7, 5], funnel: [9800, 4300, 1900], repeat: 0.18, budgetOut: true },
  223: { gmv: 188255, red: 930, cust: 640, acc: 15023, rev: 380, hold: 3140, dnq: [20, 10, 0, 0], funnel: [8600, 3500, 1500], repeat: 0.34 },
  224: { gmv: 172575, red: 767, cust: 660, acc: 15300, rev: 630, hold: 4800, dnq: [22, 10, 0, 0], funnel: [7200, 2900, 1300], repeat: 0.15 },
  225: { gmv: 150700, red: 715, cust: 470, acc: 16120, rev: 520, hold: 9500, dnq: [20, 8, 0, 0], funnel: [6022, 2590, 1610], repeat: 0.38 },
  226: { gmv: 85527, red: 763, cust: 295, acc: 19885, rev: 652, hold: 0, dnq: [18, 6, 0, 0], funnel: [4000, 1400, 700], repeat: 0.62 },
  219: { gmv: 18420, red: 76, cust: 70, acc: 1842, rev: 0, hold: 1842, dnq: [3, 1, 0, 0], funnel: [18400, 2760, 1120], repeat: 0.07 },
};
/* outlet weights so the Faces outlet table matches Figma */
const MA_OUTLET_W = { 'MID-77281105': 393800, 'MID-77281104': 168250, 'MID-77281106': 179442, 'MID-77281107': 427025 };

const maRng = (seed) => () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const maSplit = (total, weights) => {   // integer split with an exact sum
  const sw = weights.reduce((a, b) => a + b, 0) || 1;
  const raw = weights.map((w) => (total * w) / sw); const out = raw.map(Math.floor);
  let rest = total - out.reduce((a, b) => a + b, 0);
  raw.map((r, i) => [r - out[i], i]).sort((a, b) => b[0] - a[0]).forEach(([, i]) => { if (rest > 0) { out[i]++; rest--; } });
  return out;
};
const maMonday = (iso) => { const d = parseD(iso); const k = (d.getDay() + 6) % 7; d.setDate(d.getDate() - k); return isoD(d); };
const maCampaigns = (brandId) => DB.campaigns.filter((c) => c.brandId === brandId && ['live', 'completed'].includes(c.status) && c.start && c.start <= MA_ASOF)
  .sort((a, b) => maData(b).sp.gmv - maData(a).sp.gmv);

const MA_CACHE = {};
const maData = (c) => {
  if (MA_CACHE[c.id]) return MA_CACHE[c.id];
  const b = brandById(c.brandId); const r = maRng(c.id * 7919);
  const end = c.end && c.end < MA_ASOF ? c.end : MA_ASOF;
  let sp = MA_SPEC[c.id];
  if (!sp) {   // generated from the campaign settings
    const run = Math.max(1, diffDays(c.start, end) + 1), full = c.end ? Math.max(run, diffDays(c.start, c.end) + 1) : run;
    const acc = Math.round((c.budget || 20000) * (c.status === 'completed' ? 0.78 + r() * 0.2 : (run / full) * (0.55 + r() * 0.35)));
    const gmv = Math.round((acc / ((c.pct || 10) / 100)) * (0.96 + r() * 0.06));
    const red = Math.max(1, Math.round(gmv / ((b?.atv || 150) * (0.9 + r() * 0.3))));
    const cust = Math.max(1, Math.round(red * (0.62 + r() * 0.2)));
    const d = Math.round(red * (0.03 + r() * 0.03));
    sp = { gmv, red, cust, acc, rev: Math.round(acc * (0.02 + r() * 0.02)), dnq: maSplit(d, [6, 3, 0, 0.5]), funnel: [Math.round(cust * (14 + r() * 10)), 0, 0], repeat: Math.min(0.6, (red - cust) / cust + 0.05) };
    sp.funnel[1] = Math.round(sp.funnel[0] * (0.35 + r() * 0.15)); sp.funnel[2] = Math.round(sp.funnel[1] * (0.35 + r() * 0.15));
  }
  const net = sp.acc - sp.rev;
  // weekly series across the weeks the campaign ran
  const weeks = []; for (let w = maMonday(c.start); w <= end; w = addDays(w, 7)) weeks.push(w);
  const wt = weeks.map((w, i) => { const from = w < c.start ? c.start : w, to = addDays(w, 6) > end ? end : addDays(w, 6); return Math.max(0.3, diffDays(from, to) + 1) * (0.75 + 0.5 * r()) * (1 + i * 0.04); });
  const series = { weeks, gmv: maSplit(sp.gmv, wt), red: maSplit(sp.red, wt), acc: maSplit(sp.acc, wt), rev: maSplit(sp.rev, wt) };
  let hold = sp.hold;
  if (hold == null) { const cut = addDays(MA_ASOF, -(c.hold || 14)); hold = Math.min(net, Math.round(weeks.reduce((a, w, i) => a + (addDays(w, 6) >= cut ? series.acc[i] - series.rev[i] : 0), 0))); }
  // outlets: one slot per merchant ID and channel this campaign runs on
  const slots = [];
  (b?.mids || []).filter((m) => c.mids.includes(m.id)).forEach((m) => {
    const w0 = MA_OUTLET_W[m.value] || 1000 + r() * 3000;
    if (m.channel !== 'per_terminal') { slots.push({ mid: m, ch: m.channel, w: w0 }); return; }
    const chs = [...new Set(m.terminals.filter((t) => c.tids.includes(t.id)).map((t) => t.channel))];
    if (!chs.length) chs.push('in_store');
    chs.forEach((ch) => slots.push({ mid: m, ch, w: (w0 * (chs.length > 1 ? (ch === 'in_store' ? 0.85 : 0.15) : 1)) }));
  });
  if (!slots.length) slots.push({ mid: { id: 0, outlet: b?.name || 'Outlet', value: '-', terminals: [] }, ch: 'in_store', w: 1 });
  const nrG = c.brandId === 86 ? Math.round(sp.gmv * 0.0016) : 0, nrR = c.brandId === 86 ? Math.max(0, Math.round(sp.red * 0.0016)) : 0;
  const ws = slots.map((s) => s.w);
  const sg = maSplit(sp.gmv, ws), sr = maSplit(sp.red, ws);
  slots.forEach((s, i) => { s.gmv = sg[i]; s.red = sr[i]; });
  // purchases with no channel come out of the in-store slots
  const inst = slots.filter((s) => s.ch === 'in_store');
  if (inst.length && nrG) { inst[0].nrG = nrG; inst[0].nrR = nrR; }
  // purchase frequency from redemptions vs customers
  const extra = Math.max(0, sp.red - sp.cust); const rep = Math.min(sp.cust, Math.round(extra / 1.45));
  const [f2, f3, f4] = maSplit(rep, [0.7, 0.2, 0.1]);
  const avg = sp.gmv / sp.red;
  const bucket = avg < 150 ? [33, 41, 16, 7, 3] : avg < 300 ? [14, 44, 27, 10, 5] : [5, 19, 36, 25, 15];
  const fun = [...sp.funnel, Math.round(sp.cust * 1.054), sp.cust];
  return (MA_CACHE[c.id] = { c, sp, net, hold, released: net - hold, series, slots, freq: [sp.cust - rep, f2, f3, f4], bucket, funnel: fun });
};

/* period helpers */
const maPeriodRange = () => {
  const p = UI.ma.period;
  if (p === 'custom' && UI.ma.from && UI.ma.to) return [UI.ma.from, UI.ma.to];
  const days = (MA_PERIODS.find((x) => x[0] === p) || MA_PERIODS[1])[2];
  return [addDays(MA_ASOF, -(days - 1)), MA_ASOF];
};
const maPeriodLabel = () => {
  if (UI.ma.period === 'custom' && UI.ma.from) { const [a, b] = maPeriodRange(); const A = parseD(a), B = parseD(b); return `${A.getDate()} ${MONTHS[A.getMonth()]} – ${B.getDate()} ${MONTHS[B.getMonth()]} ${B.getFullYear()}`; }
  return MA_PERIODS.find((x) => x[0] === UI.ma.period)[1];
};
// complete Monday-to-Sunday weeks only: the week still in progress would read as a drop
const maWeeksInPeriod = () => { const [a, b] = maPeriodRange(); const out = []; for (let w = maMonday(a); addDays(w, 6) <= b; w = addDays(w, 7)) out.push(w); return out; };

/* one campaign inside the current period: weekly totals are exact, the rest scales by the share of redemptions in the period */
const maSlice = (c) => {
  const d = maData(c); const [a, b] = maPeriodRange();
  const idx = d.series.weeks.map((w, i) => [w, i]).filter(([w]) => addDays(w, 6) >= a && w <= b).map(([, i]) => i);
  const sum = (k) => idx.reduce((s, i) => s + d.series[k][i], 0);
  const gmv = sum('gmv'), red = sum('red'), acc = sum('acc'), rev = sum('rev');
  const f = d.sp.red ? red / d.sp.red : 0;
  const sc = (v) => Math.round(v * f);
  return {
    c, d, f, gmv, red, acc, rev, net: acc - rev, cust: sc(d.sp.cust), dnq: d.sp.dnq.map(sc),
    funnel: d.funnel.map((v, i) => (i < 3 ? v : sc(v))), freq: d.freq.map(sc), bucket: d.bucket,
    slots: d.slots.map((s) => ({ ...s, gmv: sc(s.gmv), red: sc(s.red), nrG: sc(s.nrG || 0), nrR: sc(s.nrR || 0) })),
  };
};
const maSum = (list, k) => list.reduce((s, x) => s + x[k], 0);
const maFmt = (n) => Number(Math.round(n)).toLocaleString('en-US');
const maAED = (n) => `AED ${maFmt(n)}`;
const maK = (n) => (n >= 1e6 ? `AED ${(n / 1e6).toFixed(n % 1e6 ? 1 : 0)}m` : n >= 1000 ? `AED ${Math.round(n / 1000)}k` : `AED ${Math.round(n)}`);
const maPct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
const maX = (gmv, net) => (net ? (gmv / net).toFixed(1) : '0.0');

/* status lines */
const maDaysLeft = (c) => diffDays(MA_ASOF, c.end);
const maMeta = (c, d) => {
  if (c.status === 'live') return `${esc(c.bank || 'Bank')} · ${maDaysLeft(c)} days left`;
  const ago = diffDays(c.end, MA_ASOF);
  const refunds = d && d.hold > 0 ? ` · refunds possible until ${fmtMD(addDays(c.end, c.hold || 14))}` : '';
  return `${esc(c.bank || 'Bank')} · ended ${ago} day${ago === 1 ? '' : 's'} ago${d?.sp.budgetOut ? ', budget used up' : ''}${refunds}`;

/* ---------------------------------------------------------------- overview */
const maKpis = (S, sel, all) => {

};

const maChart = (S, all, firstWeek) => {
  if (firstWeek) return `<div class="${MA_CARD} gap-4">${maTitle('Campaign performance', MA_TIPS.perf)}<div class="flex h-56 flex-col items-center justify-center gap-2 rounded-lg bg-gray-50 text-center">${ic('ph:chart-line-up', 'size-8 text-gray-600')}<p class="text-gray-1100 text-sm font-semibold">First week in progress</p><p class="text-sm text-gray-700">Weekly totals appear after the first full week ends on ${fmtMD(firstWeek)}.</p></div></div>`;
  const weeks = maWeeksInPeriod(); const m = UI.ma.metric;
  const lines = S.map((x) => { const i0 = all.indexOf(x.c); return { id: x.c.id, name: x.c.name, color: S.length === 1 ? MA_TOTAL : MA_COLORS[i0 % MA_COLORS.length], vals: weeks.map((w) => { const j = x.d.series.weeks.indexOf(w); return j < 0 ? null : x.d.series[m][j]; }) }; });
  if (S.length > 1) lines.unshift({ id: 'all', name: S.length === all.length ? 'All campaigns' : `Selected (${S.length})`, color: MA_TOTAL, total: true, vals: weeks.map((_, i) => lines.reduce((s, l) => s + (l.vals[i] || 0), 0)) });
  const vis = lines.filter((l) => !UI.ma.hidden.includes(String(l.id)));
  const max = Math.max(1, ...vis.flatMap((l) => l.vals.filter((v) => v != null)));
  const step = (() => { const raw = max / 4; const mag = 10 ** Math.floor(Math.log10(raw)); return [1, 1.5, 2, 2.5, 3, 5, 7.5, 10].map((k) => k * mag).find((v) => v >= raw); })();
  const top = step * 4, W = 900, H = 240, L = 64, R = 12, T = 10, B = 28;
  const x = (i) => L + (weeks.length < 2 ? (W - L - R) / 2 : (i * (W - L - R)) / (weeks.length - 1));
  const y = (v) => T + (1 - v / top) * (H - T - B);
  const fmtY = (v) => (m === 'red' ? maFmt(v) : maK(v));
  const grid = [0, 1, 2, 3, 4].map((k) => `<line x1="${L}" x2="${W - R}" y1="${y(k * step)}" y2="${y(k * step)}" stroke="#e1e1e1" ${k ? 'stroke-dasharray="3 4"' : ''}/><text x="${L - 10}" y="${y(k * step) + 4}" text-anchor="end" class="ma-ax">${fmtY(k * step)}</text>`).join('');
  const every = Math.ceil(weeks.length / 13);
  const xl = weeks.map((w, i) => (i % every ? '' : `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" class="ma-ax">${parseD(w).getDate()} ${MONTHS[parseD(w).getMonth()]}</text>`)).join('');
  const path = (l) => { let d = '', on = false; l.vals.forEach((v, i) => { if (v == null) { on = false; return; } d += `${on ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`; on = true; }); return `<path d="${d}" fill="none" stroke="${l.color}" stroke-width="${l.total ? 2.6 : 1.6}" stroke-linejoin="round" stroke-linecap="round"/>`; };
  window.__maChart = { weeks, lines: vis, x, y, W, H, L, R, m };
  const legend = lines.length > 1 ? `<div class="flex flex-wrap gap-2">${lines.map((l) => `<button type="button" data-act="ma-line" data-id="${l.id}" class="ma-leg ${UI.ma.hidden.includes(String(l.id)) ? 'is-off' : ''}"><span style="background:${l.color}"></span>${esc(l.name)}</button>`).join('')}</div>` : '';
  return `<div class="${MA_CARD} gap-4"><div class="flex items-center justify-between gap-4">${maTitle('Campaign performance', MA_TIPS.perf)}
    <div class="ma-seg">${[['gmv', 'GMV'], ['red', 'Redemptions']].map(([k, l]) => `<button type="button" data-act="ma-metric" data-m="${k}" class="${m === k ? 'is-on' : ''}">${l}</button>`).join('')}</div></div>
    <div class="relative" id="ma-chart"><svg viewBox="0 0 ${W} ${H}" class="block w-full" preserveAspectRatio="none" style="height:${H}px">${grid}${xl}<line id="ma-cross" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="#9a9a9a" stroke-dasharray="3 3" style="display:none"/>${vis.map(path).join('')}<g id="ma-dots"></g><rect x="${L}" y="0" width="${W - L - R}" height="${H}" fill="transparent" id="ma-hit"/></svg><div id="ma-hover" class="ma-hover" style="display:none"></div></div>
    ${legend}</div>`;
};

const maTable = (S, all) => {

  const G = 'grid grid-cols-[minmax(0,2.4fr)_6.5rem_minmax(0,1fr)_minmax(0,1fr)_4.5rem] items-center gap-3 px-4';

      <div><div class="${G} h-10 bg-gray-100 text-xs font-medium text-gray-800 shadow-[inset_0_-1px_0_0_var(--color-gray-300)]"><span>Campaign</span><span>Status</span><span class="text-right">Sales (GMV)</span><span class="text-right">Cashback cost</span><span class="text-right">Return</span></div>
      ${rows.map((x) => `<button type="button" data-act="ma-row" data-id="${x.c.id}" class="${G} ma-row w-full py-3 text-left ${UI.ma.row === x.c.id ? 'is-on' : ''}"><span class="flex min-w-0 flex-col gap-0.5"><span class="text-gray-1100 truncate text-sm font-semibold">${esc(x.c.name)}</span><span class="truncate text-xs text-gray-700">${maMeta(x.c, x.d)}</span></span><span>${maBadge(x.c.status)}</span><span class="text-gray-1100 text-right text-sm font-medium">${maAED(x.gmv)}</span><span class="text-gray-1100 text-right text-sm font-medium">${maAED(x.net)}</span><span class="text-gray-1100 text-right text-sm font-semibold">${maX(x.gmv, x.net)}×</span></button>`).join('') || '<p class="py-10 text-center text-sm text-gray-700">No campaigns in this view.</p>'}</div></div>
    ${sel ? maPanel(sel) : `<div class="${MA_CARD} items-center justify-center gap-2 text-center">${ic('ph:chart-bar', 'size-8 text-gray-600')}<p class="text-gray-1100 text-sm font-semibold">Select a campaign</p><p class="text-sm text-gray-700">Performance, budget, cashback position and rejections for that campaign will show here.</p></div>`}
  </div>`;
};
const maPanel = (x) => {
  const c = x.c, d = x.d, dnq = x.dnq.reduce((a, v) => a + v, 0);
  const dm = (iso) => `${parseD(iso).getDate()} ${MONTHS[parseD(iso).getMonth()]}`; const dates = `${dm(c.start)} to ${dm(c.end)}`;
  const when = c.status === 'live' ? `${maDaysLeft(c)} days left` : `ended ${diffDays(c.end, MA_ASOF)} days ago${d.sp.budgetOut ? ', budget used up' : ''}`;
  const st = (l, v, sub) => `<div class="flex flex-col gap-0.5"><span class="text-xs text-gray-700">${l}</span><span class="text-gray-1100 text-sm font-semibold">${v}</span>${sub ? `<span class="text-xs text-gray-700">${sub}</span>` : ''}</div>`;
  return `<div class="${MA_CARD} gap-5"><div class="flex flex-col gap-1"><div class="flex items-center gap-2"><span class="text-gray-1100 text-base font-bold">${esc(c.name)}</span>${maBadge(c.status)}</div><span class="text-xs text-gray-700">${dates} · ${when}</span></div>
    <div class="flex flex-col gap-0.5"><span class="text-gray-1100 text-2xl font-bold">${maAED(x.gmv)}</span><span class="text-xs text-gray-700">GMV</span></div>
    <div class="grid grid-cols-2 gap-4">${st('Redemptions', maFmt(x.red), `${maPct(x.red, x.red + dnq)}% of ${maFmt(x.red + dnq)} attempts`)}${st('Cashback cost (net)', maAED(x.net))}${st('Customers rewarded', maFmt(x.cust))}${st('Avg. transaction', maAED(x.red ? x.gmv / x.red : 0))}</div>
    <div class="flex flex-col gap-3 border-t border-gray-300 pt-4"><div class="flex items-center gap-1.5 text-sm font-semibold text-gray-1100">Cashback position${info(MA_TIPS.position)}</div>
      <div class="grid grid-cols-2 gap-4">${st(`Released ${info(MA_TIPS.released)}`, maAED(d.released))}${st(`On hold ${info(MA_TIPS.hold)}`, maAED(d.hold))}${st(`Didn’t qualify ${info(MA_TIPS.dnq)}`, maFmt(dnq))}</div></div>
    <a href="#/campaigns/${c.id}" class="${BTN_OUTLINE} w-full">View Campaign</a></div>`;
};
const maBudgetStrip = (x) => {
  const c = x.c, d = x.d, dnq = x.dnq.reduce((a, v) => a + v, 0), spent = d.sp.acc, bud = c.budget || 1;
  const p = Math.min(100, maPct(spent, bud));
  const left = c.status === 'live' ? [`${maDaysLeft(c)} days`, `Ends ${fmtMDY(c.end)}`] : ['Ended', d.hold > 0 ? `Refunds possible until ${fmtMD(addDays(c.end, c.hold || 14))}` : `Ended ${fmtMDY(c.end)}`];
  const st = (l, v, sub, tip) => `<div class="flex flex-col gap-0.5"><span class="flex items-center gap-1 text-xs text-gray-700">${l}${tip ? info(tip) : ''}</span><span class="text-gray-1100 text-base font-bold">${v}</span><span class="text-xs text-gray-700">${sub}</span></div>`;
  return `<div class="${MA_CARD} gap-4"><h2 class="${CARD_TITLE}">Campaign</h2>${maStrip(c, `
    <div class="flex flex-col gap-2"><div class="flex items-center justify-between text-sm"><span class="text-gray-1100 font-semibold">${maAED(spent)} of ${maAED(bud)}</span><span class="flex items-center gap-1 font-semibold text-gray-800">${p}%${info(MA_TIPS.budget)}</span></div><div class="ma-bar"><i style="width:${p}%"></i></div></div>

const maOverview = (S, sel, all, first) => `${first ? `<div class="flex items-start gap-3 rounded-xl border border-primary-100 bg-primary-50 p-4"><span class="flex size-9 shrink-0 items-center justify-center rounded-full bg-white">${ic('lucide:sparkles', 'size-4 text-primary-500')}</span><div class="flex flex-col gap-0.5"><p class="text-gray-1100 text-sm font-semibold">First results are in</p><p class="text-sm text-gray-800">${esc(first.c.name)} went live on ${fmtMD(first.c.start)}. These figures cover the first ${diffDays(first.c.start, MA_ASOF) + 1} days of purchases (${fmtMD(first.c.start)}–${parseD(MA_ASOF).getDate()}) and grow with each nightly update.</p></div></div>` : ''}

/* ---------------------------------------------------------------- customers */
const maCustomers = (S) => {
  const fun = [0, 1, 2, 3, 4].map((i) => maSum(S.map((x) => ({ v: x.funnel[i] })), 'v'));
  const dnq = [0, 1, 2, 3].map((i) => S.reduce((s, x) => s + x.dnq[i], 0)); const dt = dnq.reduce((a, b) => a + b, 0);
  const freq = [0, 1, 2, 3].map((i) => S.reduce((s, x) => s + x.freq[i], 0)); const ft = freq.reduce((a, b) => a + b, 0) || 1;
  const custW = S.reduce((s, x) => s + x.cust, 0) || 1;
  const bucket = [0, 1, 2, 3, 4].map((i) => S.reduce((s, x) => s + x.bucket[i] * x.cust, 0) / custW);
  const names = ['Audience reached', 'Viewed the offer', 'Activated', 'Transacted', 'Rewarded'];
  const tips = [MA_TIPS.audience, null, null, null, null];
  const fmax = Math.max(1, fun[0]);
  const funnel = `<div class="${MA_CARD} gap-5">${maTitle('Engagement funnel', null, 'From offer exposure to rewarded transaction')}
    <div class="grid grid-cols-5 gap-3">${fun.map((v, i) => `<div class="flex flex-col gap-2"><div class="ma-vbar"><i style="height:${Math.max(2, (v / fmax) * 100)}%;opacity:${1 - i * 0.14}"></i></div><div class="flex items-center gap-1 text-xs font-medium text-gray-800">${names[i]}${tips[i] ? info(tips[i]) : ''}</div><div class="text-gray-1100 text-lg font-bold">${maFmt(v)}</div><div class="text-xs text-gray-700">${i ? `${maPct(v, fun[0]) || '<1'}% of audience` : '100%'}</div></div>`).join('')}</div></div>`;
  const hbar = (label, n, p) => `<div class="flex flex-col gap-1.5"><div class="flex items-center justify-between text-sm"><span class="text-gray-1100 font-medium">${label}</span><span class="text-gray-1100 font-semibold">${maFmt(n)} <span class="ml-2 inline-block w-10 text-right font-normal text-gray-700">${p}%</span></span></div><div class="ma-bar"><i style="width:${p}%"></i></div></div>`;
  const why = `<div class="${MA_CARD} gap-5">${maTitle('Why transactions didn’t qualify', MA_TIPS.dnq, `${maFmt(dt)} purchase${dt === 1 ? '' : 's'} earned nothing because of a campaign setting.`)}<div class="flex flex-col gap-4">${MA_DNQ.map((l, i) => hbar(l, dnq[i], maPct(dnq[i], dt))).join('')}</div></div>`;
  const bmax = Math.max(...bucket);
  const value = `<div class="${MA_CARD} gap-5">${maTitle('Customer value', null, 'How much are customers spending?')}
    <div class="grid grid-cols-[2.5rem_1fr] gap-2"><div class="flex h-44 flex-col justify-between text-right text-xs text-gray-700">${['100%', '75%', '50%', '25%', '0%'].map((t) => `<span>${t}</span>`).join('')}</div>
    <div class="grid h-44 grid-cols-5 items-end gap-4 border-b border-gray-300">${bucket.map((v) => `<div class="flex h-full flex-col justify-end"><span class="mb-1 text-center text-xs font-semibold text-gray-1100">${Math.round(v)}%</span><i class="ma-col" style="height:${v}%;${v === bmax ? '' : 'opacity:.55'}"></i></div>`).join('')}</div>
    <span></span><div class="grid grid-cols-5 gap-4 text-center text-xs text-gray-700">${MA_BUCKETS.map((l) => `<span>${l.replace(' / ', '<br>')}</span>`).join('')}</div></div></div>`;
  const rr = ft ? ((ft - freq[0]) / ft) * 100 : 0;
  const freqCard = `<div class="${MA_CARD} gap-5">${maTitle('Purchase frequency', null, 'How often are customers purchasing?')}

/* ---------------------------------------------------------------- outlets & channel */
const maOutlets = (S) => {
  const ch = { online: { gmv: 0, red: 0 }, in_store: { gmv: 0, red: 0 } }; let nrG = 0, nrR = 0;

    x.slots.forEach((s) => {
      ch[s.ch].gmv += s.gmv - (s.nrG || 0); ch[s.ch].red += s.red - (s.nrR || 0); nrG += s.nrG || 0; nrR += s.nrR || 0;
      ch[s.ch].cust = (ch[s.ch].cust || 0) + (s.red - (s.nrR || 0)) * cr; ch[s.ch].rep = (ch[s.ch].rep || 0) + (s.red - (s.nrR || 0)) * (x.d.sp.repeat || 0.2);
      const o = by.get(s.mid.id) || { mid: s.mid, gmv: 0, red: 0, cust: 0, chs: new Set() };
      o.gmv += s.gmv; o.red += s.red; o.cust += s.red * cr; o.chs.add(s.ch); by.set(s.mid.id, o);

  const channel = `<div class="${MA_CARD} gap-5">${maTitle('Channel behaviour', MA_TIPS.channel)}

    <div class="grid ${ch.online.red && ch.in_store.red ? 'grid-cols-2' : 'grid-cols-1'} gap-4">${card('online')}${card('in_store')}</div>

  const detail = o ? `<div class="${MA_CARD} gap-5"><span class="text-xs font-semibold tracking-wide text-gray-700 uppercase">Outlet details</span>
    <div class="flex flex-col gap-0.5"><span class="text-gray-1100 text-base font-bold">${esc(o.mid.outlet)}</span><span class="text-xs text-gray-700">${[...o.chs].map((k) => CHANNEL[k].label).join(' & ')}${city(o.mid) ? ' · ' + esc(city(o.mid)) : ''}</span></div>
    <div class="flex flex-col gap-0.5"><span class="text-gray-1100 text-2xl font-bold">${maAED(o.gmv)}</span><span class="text-xs text-gray-700">GMV</span></div>

/* chart hover */
const maMount = () => {
  const hit = $('#ma-hit'), ch = window.__maChart; if (!hit || !ch) return;
  const svg = hit.ownerSVGElement, box = $('#ma-hover'), cross = $('#ma-cross'), dots = $('#ma-dots');
  const show = (e) => {
    const r = svg.getBoundingClientRect(); const px = ((e.clientX - r.left) / r.width) * ch.W;
    const n = ch.weeks.length; let i = n < 2 ? 0 : Math.round(((px - ch.L) / (ch.W - ch.L - ch.R)) * (n - 1)); i = Math.max(0, Math.min(n - 1, i));
    const xi = ch.x(i); cross.setAttribute('x1', xi); cross.setAttribute('x2', xi); cross.style.display = '';
    dots.innerHTML = ch.lines.filter((l) => l.vals[i] != null).map((l) => `<circle cx="${xi}" cy="${ch.y(l.vals[i])}" r="${l.total ? 4 : 3}" fill="#fff" stroke="${l.color}" stroke-width="2"/>`).join('');
    const w0 = parseD(ch.weeks[i]), w1 = parseD(addDays(ch.weeks[i], 6));
    const range = w0.getMonth() === w1.getMonth() ? `${w0.getDate()}–${w1.getDate()} ${MONTHS[w1.getMonth()]}` : `${w0.getDate()} ${MONTHS[w0.getMonth()]} – ${w1.getDate()} ${MONTHS[w1.getMonth()]}`;

    box.style.display = 'block';
    const left = (xi / ch.W) * r.width; const right = left > r.width / 2;
    box.style.left = right ? '' : `${left + 14}px`; box.style.right = right ? `${r.width - left + 14}px` : '';

};
let lastPath = null;

/* ------------------------------------------------------------------ floating layer: menus, calendar */
let popState = null;
const closePop = () => { const l = $('#pop-layer'); if (l) l.innerHTML = ''; popState = null; };
const placePop = () => {
  if (!popState) return;
  const el = $('#pop-layer').firstElementChild; if (!el) return;
  const r = popState.anchor.getBoundingClientRect();
  if (!r.width && !r.height) { closePop(); return; }
  const h = el.offsetHeight;
  let top = popState.above ? r.top - h - 6 : r.bottom + 4;
  if (!popState.above && top + h > innerHeight - 8) top = Math.max(8, r.top - h - 4);
  el.style.top = `${top}px`;
  el.style.left = `${Math.max(8, Math.min(popState.left ?? r.left, innerWidth - el.offsetWidth - 8))}px`;
};
const openPop = (anchor, html, opts = {}) => {
  closePop();
  const r = anchor.getBoundingClientRect();
  const layer = $('#pop-layer');
  layer.innerHTML = `<div class="x-pop" style="min-width:${opts.width || r.width}px">${html}</div>`;
  popState = { anchor, ...opts };
  placePop();
  return layer.firstElementChild;
};
const menu = (anchor, options, current, onPick, opts) => {
  const el = openPop(anchor, options.map(([v, l, extra]) => `<button type="button" class="x-opt" data-v="${esc(v)}">${extra || ''}<span class="truncate">${esc(l)}</span>${String(v) === String(current) ? `<span class="x-tick">${ic('lucide:check', 'size-4')}</span>` : ''}</button>`).join('') || '<p class="px-2 py-3 text-sm text-gray-700">No options</p>', opts);
  el.addEventListener('click', (e) => { const b = e.target.closest('.x-opt'); if (!b) return; e.stopPropagation(); closePop(); onPick(b.dataset.v); });
};
const calendar = (anchor, value, min, onPick) => {
  let view = parseD(value) || parseD(min) || new Date();
  view = new Date(view.getFullYear(), view.getMonth(), 1);
  const draw = () => {
    const y = view.getFullYear(), mo = view.getMonth();
    const first = new Date(y, mo, 1).getDay(), days = new Date(y, mo + 1, 0).getDate();
    let cells = '';
    for (let i = 0; i < first; i++) cells += '<span class="x-cal-day is-out"></span>';
    for (let d = 1; d <= days; d++) {
      const iso = isoD(new Date(y, mo, d));
      cells += `<button type="button" class="x-cal-day ${iso === value ? 'is-sel' : ''} ${iso === todayISO() ? 'is-today' : ''}" data-d="${iso}" ${min && iso < min ? 'disabled' : ''}>${d}</button>`;
    }
    return `<div class="x-cal"><div class="x-cal-head"><button type="button" class="x-cal-nav" data-nav="-1">${ic('lucide:chevron-left', 'size-4')}</button><span>${MONTHS_LONG[mo]} ${y}</span><button type="button" class="x-cal-nav" data-nav="1">${ic('lucide:chevron-right', 'size-4')}</button></div><div class="x-cal-grid">${['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'].map((d) => `<span class="x-cal-dow">${d}</span>`).join('')}${cells}</div></div>`;
  };
  const el = openPop(anchor, draw(), { width: 280 });
  el.style.padding = '0';
  el.addEventListener('click', (e) => {
    e.stopPropagation();
    const n = e.target.closest('[data-nav]');
    if (n) { view.setMonth(view.getMonth() + Number(n.dataset.nav)); el.innerHTML = draw(); return; }
    const d = e.target.closest('[data-d]');
    if (d && !d.disabled) { closePop(); onPick(d.dataset.d); }
  });
};

/* ------------------------------------------------------------------ data binding */
const setPath = (obj, path, val) => { const k = path.split('.'); let o = obj; for (let i = 0; i < k.length - 1; i++) o = o[k[i]]; o[k[k.length - 1]] = val; };
const ROOTS = { wiz: () => UI.wiz, bw: () => UI.bw, pw: () => UI.pw, settings: () => (UI.settingsDraft ||= { ...DB.merchant }) };
document.addEventListener('input', (e) => {

    if (root === 'wiz' && UI.wiz.err[rest[0]]) { delete UI.wiz.err[rest[0]]; t.closest('.x-err')?.classList.remove('x-err'); t.closest('.grid')?.querySelector('.x-err-msg')?.remove(); }

    if (scope === 'brandList') { const r = brandRows(); $('#brands-body').innerHTML = r.body; $('#brands-pager').innerHTML = r.pager; }

const lookupMenu = (input) => {

document.addEventListener('click', (e) => {

document.addEventListener('mouseover', (e) => {
  const t = e.target.closest?.('.x-tip');
  if (!t) return;
  const box = (t.closest('main') || document.body).getBoundingClientRect(), r = t.getBoundingClientRect();
  const mid = r.left + r.width / 2, half = 125 + 8; // half of the 250px max bubble, plus margin
  t.classList.toggle('x-tip-start', mid - half < box.left);
  t.classList.toggle('x-tip-end', mid - half >= box.left && mid + half > box.right);
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closePop(); document.querySelector('.x-overlay')?.remove(); } });

/* forms */
document.addEventListener('submit', (e) => {
  const f = e.target; e.preventDefault();
  const kind = f.dataset.form;
  if (kind === 'signin') {
    const em = $('#si-email').value.trim();
    const btn = $('#si-btn'); btn.disabled = true; btn.innerHTML = `${ic('ph:spinner-gap', 'size-5 animate-spin')} Logging in...`;
    setTimeout(() => { DB.authed = true; DB.user.email = em || DB.user.email; if (!DB.team.includes(DB.user.email)) DB.team.unshift(DB.user.email); save(); go('#/campaigns'); }, 700);
  }
  if (kind === 'wiz') {
    const w = UI.wiz; w.err = validateStep(w, w.step);
    if (Object.keys(w.err).length) { render(true); return; }
    if (w.step < 2) { w.step++; render(); $('#scroller') && ($('#scroller').scrollTop = 0); return; }
    const id = ++DB.nextId;
    DB.campaigns.unshift({ id, ...wizAsCampaign(w), name: w.name.trim(), status: 'in_review', bank: null, location: 'UAE', created: new Date().toISOString(), updated: new Date().toISOString(), end: w.end || null });
    if (w.draftId) DB.drafts = DB.drafts.filter((d) => d.id !== w.draftId);
    save();
    successDialog(' Campaign submitted successfully! ', `"${esc(w.name.trim())}" has been submitted to the bank for review. Once the bank approves the campaign, it will go live and become available to eligible customers.`, [{ label: ' Go to Campaign ', href: '#/campaigns', primary: true }]);
  }
  if (kind === 'bw') {
    const w = UI.bw; w.err = validateBW(w);
    if (Object.keys(w.err).length) { render(true); return; }
    if (w.step === 0) { w.step = 1; render(); return; }
    const mids = w.knows === 'yes' ? w.mids.map((m) => ({ ...m, value: m.value.trim(), acquirer: m.acquirer.trim(), outlet: m.outlet.trim(), location: m.location.trim(),
      terminals: m.terminals.filter((t) => t.value.trim()).map((t) => ({ ...t, value: t.value.trim(), tag: t.tag.trim(), name: t.tag.trim(), channel: tChan(m, t) })) })) : [];
    const data = { name: w.name.trim(), website: w.website.trim(), logo: w.logo, atv: num(w.atv), orders: num(w.orders), budget: num(w.budget), socials: Object.fromEntries(Object.entries(w.socials).filter(([, v]) => v && v.trim())), mids };
    if (w.editId) {
      Object.assign(brandById(w.editId), data); save(); toast('success', 'Brand updated successfully'); go(`#/brands/${w.editId}`);
    } else {
      const id = ++DB.nextId; DB.brands.unshift({ id, created: todayISO(), ...data }); save();
      successDialog(`${esc(data.name)} is onboarded!`, 'Your brand has been successfully onboarded. You can now create a campaign or view the brand details.', [{ label: ' View Brand ', href: `#/brands/${id}` }, { label: ' Create Campaign ', href: `#/campaigns/create?brandId=${id}`, primary: true }]);
    }
  }
  if (kind === 'settings') {
    const d = UI.settingsDraft || { ...DB.merchant }; const err = {};
    if (!d.name.trim()) err.name = 'Display name is required';
    if (!/^https?:\/\/\S+\.\S{2,}$/i.test(d.website.trim())) err.website = 'Please enter a valid URL';
    if (Object.keys(err).length) { UI.settingsErr = err; render(true); return; }
    DB.merchant = { name: d.name.trim(), website: d.website.trim() }; save(); UI.settingsEdit = false; UI.settingsErr = null; render(true); toast('success', 'Merchant profile updated');
  }
  if (kind === 'pw') {
    const p = UI.pw; const err = {};
    if (!p.cur) err.cur = 'Current password is required';
    if (!PW_RULES.every(([, fn]) => fn(p.next))) err.next = 'Password does not meet the rules below.';
    if (p.next !== p.confirm) err.confirm = 'New password and confirmation do not match.';
    UI.pwErr = err;
    if (Object.keys(err).length) { render(true); return; }
    UI.pw = { cur: '', next: '', confirm: '' }; UI.pwErr = null; render(true);
    toast('success', 'Password changed successfully', 'Use your new password the next time you sign in.');
  }
});

render();
})();
</script>
<script>/* RFP requirement tooltips. Any element with data-req="CL-3.15 CL-3.16", and any .rid or .badge whose text names
   requirement IDs, shows the requirement, our compliance status and our answer on hover and keyboard focus.
   window.RFP_REQS is injected by src/build.py with only the rows the page uses (answers as of the capture date). */
(function () {
  'use strict';
  var REQS = window.RFP_REQS || {};
  var ID = /\b(CL|OM|MS|RC|LAF|LIT|LVP)-(\d+)(?:\.(\d+))?/;
  function parse(text) {
    var out = [], prefix = null, major = null, dotted = false, last = null, pendingRange = false;
    var tokens = String(text).match(/(CL|OM|MS|RC|LAF|LIT|LVP)-\d+(?:\.\d+)?|\d+(?:\.\d+)?|\bto\b/g) || [];
    tokens.forEach(function (t) {
      if (t === 'to') { pendingRange = !!last; return; }
      var m = t.match(ID), id;
      if (m) { prefix = m[1]; dotted = !!m[3]; major = m[2]; id = t; }
      else if (prefix) {
        if (dotted) id = prefix + '-' + (t.indexOf('.') > -1 ? t : major + '.' + t);
        else if (t.indexOf('.') < 0) id = prefix + '-' + t;
        else return;
      } else return;
      if (pendingRange && last) {
        var a = last.match(ID), b = id.match(ID);
        if (a && b && a[1] === b[1]) {
          if (a[3] && b[3] && a[2] === b[2]) for (var i = +a[3] + 1; i < +b[3] && out.length < 60; i++) add(a[1] + '-' + a[2] + '.' + i);
          else if (!a[3] && !b[3]) for (var j = +a[2] + 1; j < +b[2] && out.length < 60; j++) add(a[1] + '-' + j);
        }
        pendingRange = false;
      }
      add(id); last = id;
    });
    function add(x) { if (out.indexOf(x) < 0) out.push(x); }
    return out;
  }
  window.parseReqIds = parse;
  var tip = document.createElement('div');
  tip.id = 'req-tip'; tip.setAttribute('role', 'tooltip'); tip.hidden = true;
  document.body.appendChild(tip);
  var css = document.createElement('style');
  css.textContent = '#req-tip{position:fixed;z-index:90;max-width:24rem;background:#0a634d;color:#ffffff;border-radius:calc(var(--radius,.5rem) - 2px);padding:.625rem .75rem;font:500 .75rem/1.05rem var(--font-sans,"Plus Jakarta Sans",sans-serif);box-shadow:0 8px 24px rgba(0,0,0,.18);pointer-events:none;text-align:left}' +
    '#req-tip .rq{padding:.375rem 0;border-top:1px solid rgba(255,255,255,.2)}#req-tip .rq:first-child{border-top:0;padding-top:0}#req-tip .rq:last-child{padding-bottom:0}' +
    '#req-tip b{font-weight:700}#req-tip .st{display:inline-block;margin-left:.375rem;padding:0 .375rem;border-radius:9999px;background:rgba(255,255,255,.18);font-size:.6875rem}' +
    '#req-tip .tx{margin-top:.125rem}#req-tip .an{margin-top:.25rem;opacity:.85}#req-tip .more{margin-top:.375rem;opacity:.85}' +
    '[data-req],.rid,.badge{cursor:help}[data-req]:focus-visible,.rid:focus-visible,.badge:focus-visible{outline:2px solid var(--ring,#10a37f);outline-offset:2px}';
  document.head.appendChild(css);
  function cut(s, n) { s = String(s || ''); return s.length > n ? s.slice(0, n - 1).replace(/\s+\S*$/, '') + '…' : s; }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function status(c) { return !c ? 'No answer yet' : /^Fully/.test(c) ? 'Fully Compliant' : /^Partial/.test(c) ? 'Partially Compliant' : /^Not/.test(c) ? 'Not Compliant' : String(c).replace(/\s*·\s*on the roadmap/gi, ''); }
  var PLANNED = /roadmap|delivery plan|planned/i;
  function answer(a) { return String(a || '').split(/(?<=[.!?])\s+/).filter(function (x) { return x && !PLANNED.test(x); }).join(' '); }
  function idsFor(el) {
    var src = el.getAttribute('data-req');
    if (src === null) { if (!el.classList.contains('rid') && !el.classList.contains('badge')) return []; src = el.textContent; }
    return parse(src).filter(function (x) { return REQS[x]; });
  }
  function target(e) {
    var el = e.target && e.target.closest && e.target.closest('[data-req], .rid, .badge');
    return el && idsFor(el).length ? el : null;
  }
  function show(el, x, y) {
    var ids = idsFor(el), max = 4;
    tip.innerHTML = ids.slice(0, max).map(function (id) {
      var r = REQS[id];
      return '<div class="rq"><b>' + id + '</b><span class="st">' + esc(status(r.c)) + (r.pr ? ' · ' + esc(r.pr) : '') + '</span><div class="tx">' + esc(cut(r.r, 220)) + '</div>' + (answer(r.a) ? '<div class="an">Our answer: ' + esc(cut(answer(r.a), 200)) + '</div>' : '') + '</div>';
    }).join('') + (ids.length > max ? '<div class="more">+' + (ids.length - max) + ' more: ' + ids.slice(max).join(', ') + '</div>' : '');
    tip.hidden = false;
    var w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, x + 12)) + 'px';
    tip.style.top = (y - h - 12 < 8 ? y + 20 : y - h - 12) + 'px';
  }
  document.addEventListener('pointerover', function (e) { var el = target(e); if (el) show(el, e.clientX, e.clientY); });
  document.addEventListener('pointerout', function (e) { var el = target(e); if (el && !el.contains(e.relatedTarget)) tip.hidden = true; });
  document.addEventListener('focusin', function (e) { var el = target(e); if (el) { var r = el.getBoundingClientRect(); show(el, r.left, r.top); } });
  document.addEventListener('focusout', function (e) { if (target(e)) tip.hidden = true; });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') tip.hidden = true; });
  function arm() {
    var els = document.querySelectorAll('[data-req], .rid, .badge');
    for (var i = 0; i < els.length; i++) {
      var el = els[i];
      if (el.hasAttribute('data-req-armed')) continue;
      el.setAttribute('data-req-armed', '');
      if (!idsFor(el).length) continue;
      if (!el.matches('a, button, input, select, textarea, [tabindex]')) el.setAttribute('tabindex', '0');
      if (!el.getAttribute('aria-describedby')) el.setAttribute('aria-describedby', 'req-tip');
    }
  }
  new MutationObserver(arm).observe(document.body, { childList: true, subtree: true });
  arm();
})();
</script>
<script id="pitch-mode">/* Pitch mode (16 Nov 2026): hides the internal RFP review marks (answer labels, legends, row tooltips, mode switch).
   Same rules as rfp-work/clean.js for the deck shots, but it keeps running while the app re-renders. */
(function () {
  var L = new Set(['Fully Compliant', 'Partially Compliant', 'Partially Compliant · available today', 'Partially Compliant · in delivery plan', 'Not available · in delivery plan', 'Answers conflict', 'Not in our answers', 'No answer yet', 'Not Compliant', 'On the product roadmap', 'On the product roadmap.', 'Partially Compliant · on the roadmap', 'Not available · on the roadmap', 'On the roadmap', 'Available today']);
  var st = document.createElement('style');
  st.textContent = '[data-cx=labels],.cx-tag,.mx-tag,[data-ext=switch],[data-legend],#req-tip,.rid{display:none!important}';
  document.head.appendChild(st);
  var LEG = /^(Labels (come from|show what) our RFP answers|Showing only what our answers say)/;
  function clean() {
    document.querySelectorAll('span,div,p,small,em,b,i').forEach(function (e) {
      if (e.dataset.pitchHidden) return;
      var t = (e.textContent || '').trim();
      if ((L.has(t) && e.querySelectorAll('*').length <= 1) || (LEG.test(t) && t.length < 220)) { e.style.display = 'none'; e.dataset.pitchHidden = '1'; }
    });
    document.querySelectorAll('[data-req][title]').forEach(function (e) { e.removeAttribute('title'); });
  }
  var q = false;
  new MutationObserver(function () { if (!q) { q = true; requestAnimationFrame(function () { q = false; clean(); }); } })
    .observe(document.documentElement, { childList: true, subtree: true });
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', clean); else clean();
})();
</script></body>
